# ====================================================================
# 1. CONFIGURAÇÃO DE SAÍDA (CONSOLE + ARQUIVO)
# ====================================================================

# Padrão de formatação para o console do Render / Terminal
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Mantém salvamento em arquivo local via variável de ambiente, se informada
logging.file.name=${LOG_PATH:./logs}/${spring.application.name:topomanager}.log

# ====================================================================
# 2. ROTAÇÃO DE ARQUIVOS
# ====================================================================
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=5GB
logging.logback.rollingpolicy.file-name-pattern=${logging.file.name}.%d{yyyy-MM-dd}.%i.log

# ====================================================================
# 3. NÍVEIS DE LOG
# ====================================================================
logging.level.root=INFO
logging.level.br.com.srcsoftware=DEBUG
logging.level.org.springframework=INFO

# Desativa verbosidade desnecessária
logging.level.org.apache.poi=WARN
logging.level.org.hibernate=WARN