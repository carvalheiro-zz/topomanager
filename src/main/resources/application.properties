# Importa as configurações de log
spring.config.import=optional:classpath:logs.properties

spring.application.name=topomanager

# O Render injeta a porta dinamicamente via $PORT; 8082 é mantido como fallback local
server.port=${PORT:8082}

# Java 21 / Virtual Threads
spring.threads.virtual.enabled=true

# Configuração para upload de arquivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# URL da API (Substitua pela variável do Render no ambiente de Prod se necessário)
app.api.url=${APP_API_URL:http://localhost:8082}